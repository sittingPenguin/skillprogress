name: Add mobile libraries
on:
  workflow_dispatch:
    inputs:
      packages:
        description: Space-separated packages to add with expo install
        required: true
permissions:
  contents: write
jobs:
  add:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: mobile } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm ci
      - run: npx expo install ${{ inputs.packages }}
      - run: |
          git config user.name "skillprogress-ci"; git config user.email "ci@users.noreply.github.com"
          git add package.json package-lock.json
          git commit -m "Add libraries: ${{ inputs.packages }}" && git push || echo "nothing to commit"
