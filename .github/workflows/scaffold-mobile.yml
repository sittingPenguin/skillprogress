name: Scaffold mobile app (one-off)
on: workflow_dispatch
permissions:
  contents: write
jobs:
  scaffold:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Create Expo app and add libraries
        env: { CI: "1" }
        run: |
          set -o pipefail
          mkdir -p ci-results
          {
            npx --yes create-expo-app@latest mobile --template blank-typescript --no-install
            cd mobile
            npm install
            npx expo install expo-router expo-linking expo-constants expo-status-bar react-native-safe-area-context react-native-screens \
              expo-secure-store expo-camera expo-image-picker expo-video expo-file-system expo-crypto expo-video-thumbnails \
              @react-native-async-storage/async-storage react-native-url-polyfill react-native-web react-dom @expo/metro-runtime
            npm install @supabase/supabase-js tus-js-client
            rm -rf .git
            npx expo --version
            cat package.json
          } 2>&1 | tee ../ci-results/scaffold.log || true
      - name: Commit
        run: |
          git config user.name "skillprogress-ci"
          git config user.email "ci@users.noreply.github.com"
          git add mobile ci-results
          git commit -m "Scaffold Expo app (generated by CI)"
          git push
