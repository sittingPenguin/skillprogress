<title>SkillProgress</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Figtree:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
/* Layout: a demo stage with a role/device toolbar above a live app frame (phone or tablet); the app inside is an Instagram-style private feed. */
:root{
  --bg:#E9EEEC; --surface:#FFFFFF; --surface-2:#F4F7F6; --ink:#11201C; --muted:#5A6A66; --line:#DCE4E1;
  --brand:#0E6B60; --brand-soft:#DDF0EC; --accent:#E5482F; --accent-soft:#FDE6E1;
  --ok:#1D7A4B; --ok-soft:#DFF3E7; --draft:#5B4BC4; --draft-soft:#ECE9FB; --warn:#9A5600; --warn-soft:#FBEBD3;
  --bezel:#16211E; --ring1:#FFB020; --ring2:#F2562F; --ring3:#D93A7B;
  --display:"Bricolage Grotesque", "Figtree", system-ui, sans-serif;
  --body:"Figtree", system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono:"IBM Plex Mono", ui-monospace, Menlo, monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0A100F; --surface:#111A18; --surface-2:#18231F; --ink:#E6EEEB; --muted:#93A39F; --line:#26332F;
  --brand:#45C2B1; --brand-soft:#123430; --accent:#FF6E55; --accent-soft:#3A1C16;
  --ok:#5CCB8E; --ok-soft:#12301F; --draft:#A99CFF; --draft-soft:#221D44; --warn:#F0B055; --warn-soft:#352612;
  --bezel:#2A3532; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0A100F; --surface:#111A18; --surface-2:#18231F; --ink:#E6EEEB; --muted:#93A39F; --line:#26332F;
  --brand:#45C2B1; --brand-soft:#123430; --accent:#FF6E55; --accent-soft:#3A1C16;
  --ok:#5CCB8E; --ok-soft:#12301F; --draft:#A99CFF; --draft-soft:#221D44; --warn:#F0B055; --warn-soft:#352612;
  --bezel:#2A3532; color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.45;padding-inline:16px;padding-block:20px 28px}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--brand);outline-offset:2px}
.stage{max-width:1100px;margin:0 auto;display:flex;flex-direction:column;align-items:center;gap:16px}
.toolbar{width:100%;display:flex;flex-wrap:wrap;gap:12px 20px;align-items:center;justify-content:center}
.toolbar h1{font-family:var(--display);font-weight:800;font-size:20px;margin:0;letter-spacing:-.01em}
.toolbar h1 span{color:var(--muted);font-weight:600;font-family:var(--body);font-size:14px;margin-left:6px}
.seg{display:inline-flex;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:3px}
.seg button{border:0;background:none;padding:7px 14px;border-radius:999px;font-weight:600;font-size:13.5px;color:var(--muted);min-height:36px}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--surface)}
.ghost{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 14px;font-weight:600;font-size:13.5px;min-height:36px}
.note{font-size:12.5px;color:var(--muted);text-align:center;max-width:60ch;margin:0}

.device{width:390px;max-width:100%;height:800px;border:10px solid var(--bezel);border-radius:46px;overflow:hidden;background:var(--surface);container-type:inline-size;container-name:app;box-shadow:0 30px 60px -30px rgba(10,30,25,.45);transition:width .3s ease}
.device.tablet{width:860px;height:880px;border-radius:34px}
@media (max-width:520px){.device,.device.tablet{width:100%;height:calc(100dvh - 150px);min-height:560px;border-width:0;border-radius:18px;border:1px solid var(--line)}}

.app{height:100%;display:flex;flex-direction:column;position:relative;background:var(--surface)}
.topbar{display:flex;align-items:center;gap:10px;padding:14px 16px 10px;border-bottom:1px solid var(--line);background:var(--surface);z-index:2}
.wordmark{font-family:var(--display);font-weight:800;font-size:23px;letter-spacing:-.02em;margin:0}
.wordmark b{color:var(--accent)}
.topbar .title{font-family:var(--display);font-weight:600;font-size:18px;margin:0;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.privpill{margin-left:auto;display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:600;color:var(--brand);background:var(--brand-soft);padding:4px 9px;border-radius:999px;white-space:nowrap}
.iconbtn{border:0;background:none;width:40px;height:40px;display:grid;place-items:center;border-radius:12px;flex:none}
.iconbtn:hover{background:var(--surface-2)}
.screen{flex:1;overflow-y:auto;overflow-x:hidden;scroll-behavior:smooth}
.wrap{max-width:620px;margin:0 auto}
.nav{display:flex;justify-content:space-around;border-top:1px solid var(--line);padding:6px 6px calc(10px + env(safe-area-inset-bottom,0px));background:var(--surface)}
.nav button{border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;font-weight:600;color:var(--muted);min-width:56px;min-height:48px;padding:4px;border-radius:12px}
.nav button[aria-current="page"]{color:var(--ink)}
.nav button.plus svg{background:var(--ink);color:var(--surface);border-radius:10px;padding:5px;width:34px;height:30px}
svg.i{width:24px;height:24px;flex:none}
svg.s{width:16px;height:16px;flex:none}

/* stories */
.stories{display:flex;gap:14px;overflow-x:auto;padding:14px 16px 10px;scrollbar-width:none}
.story{border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:5px;width:68px;flex:none;font-size:12px;padding:0}
.story span.n{max-width:68px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ring{padding:3px;border-radius:50%;background:var(--line)}
.ring.new{background:conic-gradient(from 210deg,var(--ring1),var(--ring2),var(--ring3),var(--ring1))}
.ring > .av{border:3px solid var(--surface)}
.av{width:58px;height:58px;border-radius:50%;display:grid;place-items:center;font-family:var(--display);font-weight:800;font-size:19px;color:#fff;flex:none}
.av.sm{width:34px;height:34px;font-size:12.5px;border-width:2px}
.av.lg{width:84px;height:84px;font-size:28px}
.chips{display:flex;gap:8px;overflow-x:auto;padding:4px 16px 12px;scrollbar-width:none}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 13px;font-size:13px;font-weight:600;white-space:nowrap;min-height:34px}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--surface);border-color:var(--ink)}

/* post */
.post{border-top:1px solid var(--line);padding-bottom:14px}
.post-h{display:flex;align-items:center;gap:10px;padding:10px 14px}
.post-h .who{flex:1;min-width:0}
.post-h .who b{display:block;font-size:14.5px}
.post-h .who small{color:var(--muted);font-size:12.5px;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pill{display:inline-flex;align-items:center;gap:4px;font-size:11.5px;font-weight:700;padding:4px 9px;border-radius:999px;white-space:nowrap;flex:none}
.pill.pub{background:var(--ok-soft);color:var(--ok)}
.pill.draft{background:var(--draft-soft);color:var(--draft)}
.pill.restr{background:var(--warn-soft);color:var(--warn)}
.pill.priv{background:var(--surface-2);color:var(--muted)}

.player{position:relative;background:#0d1719;user-select:none}
.player canvas{display:block;width:100%;aspect-ratio:4/5}
.player .pp{position:absolute;left:50%;top:44%;transform:translate(-50%,-50%);width:64px;height:64px;border-radius:50%;border:0;background:rgba(255,255,255,.88);color:#11201C;display:grid;place-items:center;transition:opacity .2s}
.player.playing .pp{opacity:0}
.player .pp svg{width:28px;height:28px}
.pctrl{display:flex;align-items:center;gap:8px;padding:8px 12px;background:#0d1719;color:#e7efec;font-family:var(--mono);font-size:12px}
.pctrl input[type=range]{flex:1;min-width:0;accent-color:var(--ring2);height:28px}
.pctrl .spd{border:1px solid rgba(255,255,255,.3);background:none;color:inherit;border-radius:8px;padding:4px 7px;font-family:var(--mono);font-size:12px;min-height:30px}
.pctrl .spd[aria-pressed="true"]{background:#e7efec;color:#0d1719}
.pctrl .tbtn{border:0;background:none;color:inherit;width:32px;height:32px;display:grid;place-items:center}
.tc{font-variant-numeric:tabular-nums;min-width:48px}

.actions{display:flex;gap:4px;padding:6px 8px 0;align-items:center}
.act{border:0;background:none;display:inline-flex;align-items:center;gap:6px;padding:8px;border-radius:10px;font-weight:600;font-size:13.5px;min-height:40px}
.act:hover{background:var(--surface-2)}
.act.on{color:var(--accent)}
.act.on svg{fill:currentColor}
.act.right{margin-left:auto}
.cap{padding:2px 16px 0;font-size:14.5px}
.cap p{margin:6px 0}
.lvls{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}
.lvl{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;background:var(--surface-2);border:1px solid var(--line);border-radius:8px;padding:4px 8px}
.pips{display:inline-flex;gap:2px}
.pips i{width:7px;height:7px;border-radius:2px;border:1.5px solid var(--brand)}
.pips i.f{background:var(--brand)}
.goalbox{display:flex;gap:10px;align-items:flex-start;background:var(--brand-soft);border-radius:12px;padding:10px 12px;margin:10px 0 4px;font-size:14px}
.goalbox svg{color:var(--brand);margin-top:1px}
.goalbox small{display:block;color:var(--brand);font-weight:700;font-size:11.5px;letter-spacing:.06em;text-transform:uppercase}
.moments{list-style:none;padding:0;margin:8px 0 0;display:flex;flex-direction:column;gap:2px}
.moments button{border:0;background:none;display:flex;gap:10px;align-items:baseline;text-align:left;width:100%;padding:6px 4px;border-radius:8px;font-size:13.5px}
.moments button:hover{background:var(--surface-2)}
.moments .tcb{font-family:var(--mono);font-size:12px;color:var(--accent);font-weight:500;flex:none}
.privnote{margin-top:10px;border:1.5px dashed var(--line);border-radius:12px;padding:8px 12px;font-size:13.5px;color:var(--muted)}
.privnote b{display:flex;gap:5px;align-items:center;color:var(--ink);font-size:12px;letter-spacing:.04em;text-transform:uppercase}
.meta{color:var(--muted);font-size:12.5px}
.btn{border:0;border-radius:12px;padding:12px 16px;font-weight:700;font-size:14.5px;min-height:46px;display:inline-flex;align-items:center;justify-content:center;gap:8px}
.btn.pri{background:var(--ink);color:var(--surface)}
.btn.acc{background:var(--accent);color:#fff}
.btn.sec{background:var(--surface-2);border:1px solid var(--line)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.block{width:100%}
.inline-cta{margin:10px 16px 0}

/* profile */
.prof{display:flex;gap:18px;align-items:center;padding:18px 16px 6px}
.prof h2{font-family:var(--display);font-size:22px;margin:0;letter-spacing:-.01em}
.stats{display:flex;gap:18px;margin-top:8px}
.stats div{font-size:12.5px;color:var(--muted)}
.stats b{display:block;font-size:17px;color:var(--ink);font-variant-numeric:tabular-nums}
.prof-actions{display:flex;gap:8px;padding:10px 16px}
.prof-actions .btn{flex:1;min-height:40px;padding:8px 10px;font-size:13.5px}
.tabs{display:flex;border-bottom:1px solid var(--line);margin-top:6px}
.tabs button{flex:1;border:0;background:none;padding:12px 4px;font-weight:600;font-size:13.5px;color:var(--muted);border-bottom:2px solid transparent;min-height:46px}
.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--ink)}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:2px}
@container app (min-width:640px){.grid{grid-template-columns:repeat(4,1fr)}}
.tile{position:relative;border:0;padding:0;background:#0d1719;aspect-ratio:1}
.tile canvas{width:100%;height:100%;display:block}
.tile .tb{position:absolute;left:6px;bottom:6px;font-size:11px;font-weight:700;color:#fff;background:rgba(0,0,0,.55);padding:2px 6px;border-radius:6px}
.tile .tt{position:absolute;right:6px;top:6px}
.blk{padding:14px 16px}
.blk h3{font-family:var(--display);font-size:17px;margin:0 0 4px}
.crit{margin:14px 0}
.crit-h{display:flex;justify-content:space-between;gap:8px;font-size:13.5px;font-weight:600}
.crit-h span{color:var(--muted);font-weight:500}
.spark{width:100%;height:auto;display:block;margin-top:4px}
.goal{display:flex;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}
.goal:last-child{border-bottom:0}
.goal p{margin:2px 0 0;font-size:13px;color:var(--muted)}
.gs{font-size:11.5px;font-weight:700;padding:3px 8px;border-radius:999px;display:inline-flex;align-items:center;gap:4px;margin-top:6px}
.gs.achieved{background:var(--ok-soft);color:var(--ok)}
.gs.progress{background:var(--brand-soft);color:var(--brand)}
.gs.replaced{background:var(--surface-2);color:var(--muted);text-decoration:none}
.callout{display:flex;gap:10px;background:var(--surface-2);border:1px solid var(--line);border-radius:12px;padding:10px 12px;font-size:13px;color:var(--muted);margin:10px 0}
.callout.warn{background:var(--warn-soft);border-color:transparent;color:var(--ink)}
.callout.warn svg{color:var(--warn)}

/* lists */
.list{list-style:none;margin:0;padding:0}
.row{display:flex;align-items:center;gap:12px;padding:10px 16px;border:0;background:none;width:100%;text-align:left;min-height:64px}
.row:hover{background:var(--surface-2)}
.row .grow{flex:1;min-width:0}
.row small{display:block;color:var(--muted);font-size:12.5px}
.grouphead{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:6px 16px 2px}
.grouphead .meta{display:inline-flex;align-items:center;gap:4px}
.newchip{display:inline-flex;align-items:center;gap:4px;border-style:dashed}
.chip .meta{font-weight:500;margin-left:2px}
.chip[aria-pressed="true"] .meta{color:inherit;opacity:.7}
.pick .row{padding-inline:4px;border-radius:12px}
.tick{width:26px;height:26px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;color:transparent;flex:none}
.pick .row[aria-pressed="true"] .tick{background:var(--brand);border-color:var(--brand);color:#fff}
.search{margin:12px 16px;display:flex;align-items:center;gap:8px;background:var(--surface-2);border-radius:12px;padding:0 12px}
.search input{border:0;background:none;flex:1;padding:11px 0;min-width:0}
.search input:focus{outline:none}
.search:focus-within{outline:3px solid var(--brand)}

/* forms */
.field{display:flex;flex-direction:column;gap:6px;margin:0 0 14px}
.field label,.flabel{font-weight:600;font-size:13.5px}
.field input,.field select,.field textarea{border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:11px 12px;min-height:46px;width:100%}
.field textarea{min-height:76px;resize:vertical}
.field .hint{font-size:12px;color:var(--muted)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.srcs{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px}
.src{border:1.5px solid var(--line);background:var(--surface);border-radius:16px;padding:16px 12px;display:flex;flex-direction:column;align-items:center;gap:6px;font-weight:700;min-height:100px}
.src small{font-weight:500;color:var(--muted);font-size:12px;text-align:center}
.src[aria-pressed="true"]{border-color:var(--ink);background:var(--surface-2)}
.viewfinder{position:relative;border-radius:16px;overflow:hidden;background:#0d1719;margin-bottom:14px}
.viewfinder canvas{display:block;width:100%;aspect-ratio:4/3}
.rec{position:absolute;top:10px;left:10px;display:flex;gap:6px;align-items:center;color:#fff;font-family:var(--mono);font-size:12px;background:rgba(0,0,0,.5);padding:3px 8px;border-radius:6px}
.rec i{width:9px;height:9px;border-radius:50%;background:#ff4b3a;animation:blink 1s infinite}
@keyframes blink{50%{opacity:.2}}
.progress{height:10px;border-radius:99px;background:var(--surface-2);overflow:hidden;border:1px solid var(--line)}
.progress > i{display:block;height:100%;background:var(--brand);transition:width .2s}
.upcard{border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:14px;display:flex;flex-direction:column;gap:10px}
.upcard .hd{display:flex;justify-content:space-between;gap:8px;font-weight:700;font-size:14px}
.upcard .hd span{font-variant-numeric:tabular-nums}
.check{display:flex;gap:10px;align-items:flex-start;font-size:13.5px;margin-bottom:14px}
.check input{width:20px;height:20px;margin-top:1px;accent-color:var(--brand);flex:none}

.rub{border:1px solid var(--line);border-radius:14px;padding:12px;margin-bottom:10px}
.rub-h{font-weight:700;font-size:14px;margin-bottom:8px}
.lvlbtns{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.lvlbtns.l3{grid-template-columns:repeat(3,1fr)}
.lvlbtns button{border:1.5px solid var(--line);background:var(--surface);border-radius:10px;padding:8px 2px;font-size:12px;font-weight:600;display:flex;flex-direction:column;align-items:center;gap:2px;min-height:52px}
.lvlbtns button b{font-size:16px;font-family:var(--display)}
.lvlbtns button[aria-pressed="true"]{border-color:var(--brand);background:var(--brand-soft);color:var(--brand)}
.lvldesc{font-size:13px;color:var(--muted);margin-top:8px;min-height:1.4em}
.addmoment{display:flex;gap:8px}
.addmoment input{flex:1;min-width:0;border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:10px 12px;min-height:46px}
.foot{position:sticky;bottom:0;display:flex;gap:10px;padding:12px 16px;background:var(--surface);border-top:1px solid var(--line)}
.foot .btn{flex:1}
.privfield{border:1.5px dashed var(--line);border-radius:14px;padding:12px}
.privfield label{display:flex;align-items:center;gap:6px}

/* compare */
.cmp-pick{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:12px 16px 4px}
.cmp-grid{display:grid;grid-template-columns:1fr;gap:14px;padding:8px 0}
.cmp-grid .player canvas{aspect-ratio:5/4}
@container app (min-width:640px){.cmp-grid{grid-template-columns:1fr 1fr;padding:8px 16px;gap:16px}.cmp-grid .player canvas{aspect-ratio:4/5}.cmp-col{border:1px solid var(--line);border-radius:16px;overflow:hidden}}
.cmp-tag{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:10px 14px}
.cmp-tag b{font-family:var(--display);font-size:16px}
.badge{font-family:var(--display);font-weight:800;width:26px;height:26px;border-radius:8px;display:inline-grid;place-items:center;background:var(--ink);color:var(--surface);font-size:14px;margin-right:6px}
.alignrow{display:flex;gap:8px;align-items:center;padding:8px 14px;font-size:12.5px;color:var(--muted)}
.alignrow .btn{min-height:36px;padding:6px 10px;font-size:12.5px;border-radius:10px}
.cmp-info{padding:0 14px 12px;font-size:13.5px}
.linkbar{margin:0 16px;padding:12px;border-radius:14px;background:var(--surface-2);border:1px solid var(--line);display:flex;flex-direction:column;gap:8px;font-size:13px}
.linkbar .row2{display:flex;gap:8px;flex-wrap:wrap}
.linkbar .btn{flex:1;min-height:42px;font-size:13.5px}
table.diff{width:100%;border-collapse:collapse;font-size:13.5px}
table.diff th,table.diff td{padding:9px 6px;border-bottom:1px solid var(--line);text-align:left}
table.diff th{font-size:11.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.chg{display:inline-flex;gap:4px;align-items:center;font-weight:700;white-space:nowrap}
.chg.up{color:var(--ok)}
.chg.same{color:var(--muted)}
.chg.down{color:var(--warn)}

/* alerts */
.lock{margin:16px;border-radius:22px;padding:18px;background:linear-gradient(160deg,#20363a,#0f1b1d);color:#eef4f2}
.lock .clock{font-family:var(--display);font-size:44px;font-weight:600;text-align:center;line-height:1}
.lock .date{text-align:center;font-size:13px;opacity:.8;margin-bottom:14px}
.notif{background:rgba(255,255,255,.14);border-radius:14px;padding:10px 12px;font-size:13px;display:flex;gap:10px}
.notif .ic{width:30px;height:30px;border-radius:8px;background:#E5482F;display:grid;place-items:center;font-family:var(--display);font-weight:800;color:#fff;flex:none}
.cap-label{font-size:11.5px;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);font-weight:700;padding:14px 16px 4px;margin:0}
.empty{padding:40px 24px;text-align:center;color:var(--muted)}
.empty b{display:block;color:var(--ink);font-family:var(--display);font-size:17px;margin-bottom:4px}

let D = SEED();
const S = { role:'coach', device:'phone', view:{name:'home'}, history:[], filter:'all', ptab:'clips', pskill:'shooting', q:'', rec:null, group:'y8', gdraft:null, gdel:false };

const stu = id => D.students.find(s => s.id === id);
const grp = id => D.groups.find(g => g.id === id) || D.groups[0];
const clipById = id => D.clips.find(c => c.id === id);
const fmtDate = (iso, y=false) => { const d = new Date(iso.slice(0,10)+'T12:00:00'); return d.toLocaleDateString('en-GB', y ? {day:'numeric',month:'short',year:'numeric'} : {day:'numeric',month:'short'}); };
const fmtT = t => { t = Math.max(0,t); const m = Math.floor(t/60), s = t - m*60; return `${m}:${s.toFixed(1).padStart(4,'0')}`; };
const canSee = c => S.role === 'coach' || (PARENT_OF.includes(c.sid) && c.status === 'published' && !c.restricted);
const visible = () => D.clips.filter(canSee).sort((a,b) => b.rec.localeCompare(a.rec) || b.up.localeCompare(a.up));
const avatar = (s, cls='') => `<span class="av ${cls}" style="background:${s.col}" aria-hidden="true">${s.ini}</span>`;

/* ---------- simulated video ---------- */
const DUR = 4.0, MOVE = 1.6;
const clamp = (v,a=0,b=1) => Math.min(b, Math.max(a, v));
const sm = x => { x = clamp(x); return x*x*(3-2*x); };
const lerp = (a,b,t) => a + (b-a)*t;

function figureAt(ctx, x, G, u, col, lw){ // background child silhouette
  ctx.strokeStyle = col; ctx.fillStyle = col; ctx.lineWidth = lw; ctx.lineCap='round';
  const L=1.5*u, hip=G-2*L, sh=hip-2*u;
  ctx.beginPath(); ctx.moveTo(x-.3*u,G); ctx.lineTo(x,hip); ctx.lineTo(x+.3*u,G); ctx.moveTo(x,hip); ctx.lineTo(x,sh);
  ctx.moveTo(x-.8*u,sh+.9*u); ctx.lineTo(x,sh+.1*u); ctx.lineTo(x+.8*u,sh+.9*u); ctx.stroke();
  ctx.beginPath(); ctx.arc(x, sh-.7*u, .42*u, 0, Math.PI*2); ctx.fill();
}

function drawClip(ctx, W, H, c, t, speed){
  const u = Math.min(H/9.5, W/6.2), G = H*0.9, motion = skill(c.skill).motion, q = c.q;
  const bg = ctx.createLinearGradient(0,0,0,H);
  bg.addColorStop(0,'#1a2a33'); bg.addColorStop(.6,'#24363f'); bg.addColorStop(.6,'#2c4a3e'); bg.addColorStop(1,'#1d362c');
  ctx.fillStyle = bg; ctx.fillRect(0,0,W,H);
  ctx.strokeStyle = 'rgba(255,255,255,.05)'; ctx.lineWidth = 1;
  for (let x = W*0.06; x < W; x += W/9){ ctx.beginPath(); ctx.moveTo(x,0); ctx.lineTo(x,H*.6); ctx.stroke(); }
  ctx.strokeStyle = 'rgba(255,255,255,.5)'; ctx.lineWidth = Math.max(1,u*.06);
  ctx.beginPath(); ctx.moveTo(0,G+u*.25); ctx.lineTo(W,G+u*.25); ctx.stroke();
  if (c.restricted){ ctx.save(); ctx.globalAlpha=.55; if ('filter' in ctx) ctx.filter='blur(2px)';
    figureAt(ctx, W*.12, G-u*.6, u*.62, '#9fb2b8', u*.2); figureAt(ctx, W*.24, G-u*.8, u*.55, '#9fb2b8', u*.18); ctx.restore(); }

  const postX = W*0.86, Ry = G - 6.0*u, rx = postX - .62*u;
  const X = Math.max(1.4*u, postX - (motion==='pass' ? 5.2 : 4.6)*u);
  const pc = clamp((t - c.off)/MOVE, 0, 1.7);
  if (motion === 'shoot'){
    ctx.strokeStyle='#c9d4d8'; ctx.lineWidth=.2*u; ctx.lineCap='round';
    ctx.beginPath(); ctx.moveTo(postX,G+u*.25); ctx.lineTo(postX,Ry-.2*u); ctx.lineTo(rx+.5*u,Ry); ctx.stroke();
  } else {
    ctx.fillStyle='#F2562F'; ctx.beginPath(); ctx.moveTo(postX,G-1.4*u); ctx.lineTo(postX-.5*u,G+.25*u); ctx.lineTo(postX+.5*u,G+.25*u); ctx.closePath(); ctx.fill();
    ctx.strokeStyle='rgba(255,255,255,.35)'; ctx.lineWidth=.08*u; ctx.beginPath(); ctx.arc(postX, G-3.3*u, .9*u, 0, Math.PI*2); ctx.stroke();
  }

  const bend = .3 + .7*q;
  const dip = pc < .35 ? sm(pc/.35) : pc < .55 ? 1 - sm((pc-.35)/.2) : 0;
  const k = dip*bend*(motion==='pass'?.6:1), a = k*.8;
  const rise = (motion==='shoot' && pc > .5 && pc < .85) ? Math.sin((pc-.5)/.35*Math.PI)*(.15+.3*q) : 0;
  const step = motion==='pass' ? sm((pc-.3)/.3)*(.4+.5*q) : 0;
  const Lg = 1.5*u, idle = pc===0 ? Math.sin(t*3)*.04*u : 0;
  const hip = {x: X + .15*u - .25*u*k + step*u*.5, y: G - 2*Lg*Math.cos(a) - rise*u + idle};
  const sh = {x: hip.x + .25*u*k + .1*u, y: hip.y - 2.0*u};
  ctx.strokeStyle = '#F3F6F5'; ctx.fillStyle = '#F3F6F5'; ctx.lineWidth = .19*u; ctx.lineCap = 'round'; ctx.lineJoin = 'round';
  [[X, 0],[X + .35*u, step*u]].forEach(([f, st]) => {
    const fx = f + st, knee = {x: (fx + hip.x)/2 + Lg*Math.sin(a), y: (G + hip.y)/2 - rise*u*.4};
    ctx.beginPath(); ctx.moveTo(hip.x, hip.y); ctx.lineTo(knee.x, knee.y); ctx.lineTo(fx, G - rise*u); ctx.lineTo(fx + .45*u, G); ctx.stroke();
  });
  ctx.beginPath(); ctx.moveTo(hip.x, hip.y); ctx.lineTo(sh.x, sh.y); ctx.stroke();
  ctx.beginPath(); ctx.arc(sh.x + .08*u, sh.y - .72*u, .42*u, 0, Math.PI*2); ctx.fill();

  let hold, ext;
  if (motion === 'shoot'){ hold = {x: sh.x + .3*u, y: sh.y - 1.35*u + k*.3*u}; ext = {x: sh.x + .6*u, y: sh.y - 2.05*u}; }
  else { hold = {x: sh.x + .5*u, y: sh.y + .55*u}; ext = {x: sh.x + 1.55*u, y: sh.y + .45*u}; }
  const e = pc < .4 ? 0 : pc < .6 ? sm((pc-.4)/.2) : 1;
  let hands = {x: lerp(hold.x, ext.x, e), y: lerp(hold.y, ext.y, e)};
  if (pc > .75){ const dr = sm((pc-.75)/.2)*(1-q); hands = {x: lerp(hands.x, sh.x + .5*u, dr), y: lerp(hands.y, sh.y + 1.2*u, dr)}; }
  const mid = {x: (sh.x + hands.x)/2, y: (sh.y + hands.y)/2};
  const elbow = motion === 'shoot' ? {x: mid.x - (.2 + .6*(1-q))*u, y: mid.y + .1*u} : {x: mid.x, y: mid.y + (.35 + .3*(1-q))*u};
  [0, .1*u].forEach(o => { ctx.beginPath(); ctx.moveTo(sh.x, sh.y); ctx.lineTo(elbow.x + o, elbow.y); ctx.lineTo(hands.x + o, hands.y); ctx.stroke(); });
  if (pc > .6 && (motion !== 'shoot' || pc < 1.6)){ ctx.lineWidth = .14*u; ctx.beginPath(); ctx.moveTo(hands.x, hands.y);
    ctx.lineTo(hands.x + (.2 + .2*q)*u, hands.y + (motion==='shoot' ? .25*q*u : .3*u)); ctx.stroke(); }

  // ball
  let b;
  const rel = .58;
  if (pc < rel){ b = motion==='shoot' ? {x: hands.x + .05*u, y: hands.y - .38*u} : {x: hands.x + .4*u, y: hands.y}; }
  else if (motion === 'shoot'){
    const st = {x: ext.x + .05*u, y: ext.y - .38*u};
    const good = q >= .6, tg = good ? {x: rx, y: Ry - .1*u} : {x: rx - .8*u, y: Ry + .05*u};
    const f = clamp((pc - rel)/.32);
    b = {x: lerp(st.x, tg.x, f), y: lerp(st.y, tg.y, f) - (1.2 + 1.3*q)*u*4*f*(1-f)};
    if (f >= 1){ const g = clamp((pc - .9)/.5);
      b = good ? {x: rx, y: lerp(Ry, G - .36*u, g*g)} : {x: tg.x - g*1.8*u, y: tg.y - Math.sin(g*Math.PI)*.9*u + g*g*(G - .36*u - tg.y)}; }
  } else {
    const st = {x: ext.x + .4*u, y: ext.y}, f = clamp((pc - rel)/.4);
    b = {x: lerp(st.x, postX, f), y: lerp(st.y, G - 3.3*u + (1-q)*1.3*u, f)};
  }
  ctx.fillStyle = '#F2B33D'; ctx.beginPath(); ctx.arc(b.x, b.y, .36*u, 0, Math.PI*2); ctx.fill();
  ctx.strokeStyle = 'rgba(80,40,0,.45)'; ctx.lineWidth = .05*u; ctx.beginPath(); ctx.arc(b.x, b.y, .36*u, -.6, 1.8); ctx.stroke();
  if (motion === 'shoot'){ ctx.strokeStyle = '#FF6B4A'; ctx.lineWidth = .13*u; ctx.beginPath(); ctx.ellipse(rx, Ry, .55*u, .14*u, 0, 0, Math.PI*2); ctx.stroke(); }

  // overlay text
  const fs = Math.max(10, u*.36);
  ctx.font = `500 ${fs}px "IBM Plex Mono", ui-monospace, monospace`; ctx.textBaseline = 'top';
  ctx.fillStyle = 'rgba(255,255,255,.8)';
  ctx.fillText(fmtDate(c.rec, true).toUpperCase(), fs*.9, fs*.9);
  if (speed && speed !== 1){ const s = speed + '×'; ctx.fillText(s, W - fs*.9 - ctx.measureText(s).width, fs*.9); }
  if (c.restricted){ ctx.fillStyle = 'rgba(240,176,85,.95)'; ctx.fillText('OTHER PUPILS IN SHOT', fs*.9, fs*2.3); }
}

/* ---------- players ---------- */
const players = new Map(); let pidN = 0;
function playerHTML(c, mode='feed'){ // mode: feed | full | thumb
  const id = 'p' + (++pidN);
  if (mode === 'thumb') return `<canvas data-clip="${c.id}" data-pid="${id}" data-thumb="1"></canvas>`;
  const speeds = [1,.5,.25].map(v => `<button class="spd" data-action="speed" data-pid="${id}" data-v="${v}" aria-pressed="${v===1}" aria-label="Speed ${v} times">${v}×</button>`).join('');
  return `<div class="player" id="${id}-w">
    <canvas data-clip="${c.id}" data-pid="${id}" role="img" aria-label="${esc(stu(c.sid).name)}, ${esc(skill(c.skill).name)}, recorded ${fmtDate(c.rec,true)}. Simulated clip."></canvas>
    <button class="pp" data-action="toggle" data-pid="${id}" aria-label="Play">${icon('play')}</button>
    <div class="pctrl">
      ${mode==='full' ? `<button class="tbtn" data-action="toggle" data-pid="${id}" aria-label="Play or pause" id="${id}-tb">${icon('play','s')}</button>` : ''}
      <span class="tc" id="${id}-tc">0:00.0</span>
      <input type="range" min="0" max="${DUR}" step="0.05" value="0" data-pid="${id}" id="${id}-r" aria-label="Seek">
      ${speeds}
    </div></div>`;
}
function mountPlayers(root){
  root.querySelectorAll('canvas[data-pid]').forEach(cv => {
    const c = clipById(cv.dataset.clip), r = cv.getBoundingClientRect(), dpr = window.devicePixelRatio || 1;
    cv.width = Math.max(1, Math.round(r.width*dpr)); cv.height = Math.max(1, Math.round(r.height*dpr));
    const P = {id: cv.dataset.pid, c, cv, ctx: cv.getContext('2d'), t: cv.dataset.thumb ? c.off + MOVE*.52 : 0, playing:false, speed:1, align:null, dirty:true, thumb: !!cv.dataset.thumb};
    players.set(P.id, P);
  });
}
function paint(P){
  drawClip(P.ctx, P.cv.width, P.cv.height, P.c, P.t, P.speed);
  if (P.thumb) return;
  const w = document.getElementById(P.id+'-w'), tc = document.getElementById(P.id+'-tc'), r = document.getElementById(P.id+'-r'), tb = document.getElementById(P.id+'-tb');
  if (tc) tc.textContent = fmtT(P.t);
  if (r && document.activeElement !== r) r.value = P.t;
  if (w) w.classList.toggle('playing', P.playing);
  const pp = w && w.querySelector('.pp'); if (pp) { pp.innerHTML = icon(P.playing ? 'pause' : 'play'); pp.setAttribute('aria-label', P.playing ? 'Pause' : 'Play'); }
  if (tb) tb.innerHTML = icon(P.playing ? 'pause' : 'play', 's');
}
let last = performance.now();
function loop(now){
  const dt = Math.min(.1, (now - last)/1000); last = now;
  players.forEach(P => {
    if (P.playing){ P.t += dt*P.speed; if (P.t >= DUR){ P.t = DUR; P.playing = false; } P.dirty = true; }
    if (P.dirty && P.cv.isConnected){ paint(P); P.dirty = false; }
  });
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
function togglePlay(P){ if (P.t >= DUR - .01) P.t = 0; P.playing = !P.playing; P.dirty = true; }

function spark(R, crit, sessions){
  const n = sessions.length, W = 300, H = 74, x = i => n === 1 ? W/2 : 22 + i*(W-44)/(n-1), y = l => 62 - (l-1)*(48/(R.levels.length-1));
  const pts = sessions.map((c,i) => c.scores[crit.key] ? [x(i), y(c.scores[crit.key]), c.scores[crit.key]] : null).filter(Boolean);
  const grid = R.levels.map((_,i) => `<line x1="10" x2="${W-10}" y1="${y(i+1)}" y2="${y(i+1)}" stroke="var(--line)" stroke-dasharray="3 4"/>`).join('');
  const path = pts.length > 1 ? `<polyline points="${pts.map(p => p[0]+','+p[1]).join(' ')}" fill="none" stroke="var(--brand)" stroke-width="2.5" stroke-linejoin="round"/>` : '';
  const dots = pts.map(p => `<circle cx="${p[0]}" cy="${p[1]}" r="9" fill="var(--surface)" stroke="var(--brand)" stroke-width="2"/><text x="${p[0]}" y="${p[1]+4}" text-anchor="middle" font-size="11" font-weight="700" fill="var(--ink)">${p[2]}</text>`).join('');
  return `<svg class="spark" viewBox="0 0 ${W} ${H}" role="img" aria-label="${crit.name}: ${sessions.map(c => `${fmtDate(c.rec)} level ${c.scores[crit.key] ?? 'not assessed'}`).join(', ')}">${grid}${path}${dots}</svg>`;
}

let upTimer = null;
function runUpload(){
  clearInterval(upTimer);
  upTimer = setInterval(() => {
    const r = S.rec; if (!r || !['compress','upload'].includes(r.stage)){ clearInterval(upTimer); return; }
    if (r.stage === 'compress'){ r.pct += 9; if (r.pct >= 100){ r.stage = 'upload'; r.pct = 0; } }
    else { r.pct += 4.5; if (r.drop && !r.dropped && r.pct >= 58){ r.pct = 58; r.stage = 'failed'; r.dropped = true; clearInterval(upTimer); }
      else if (r.pct >= 100){ r.pct = 100; r.stage = 'done'; clearInterval(upTimer); finishUpload(); } }
    if (S.view.name === 'new') render();
  }, 160);
}
function finishUpload(){
  const r = S.rec, sk = skill(r.skill);
  if (!clipById(r.uploadId)){
    D.clips.push({id:r.uploadId, sid:r.sid, skill:r.skill, rec:r.date, up:'2026-10-02 10:24', status:'draft', q:.72, off:.8, drill:r.drill, rubric:sk.rubric, scores:{}, feedback:'', strengths:'', improve:'', goal:'', note:'', moments:[], restricted:false, cheer:false});
  }
  const id = r.uploadId; S.rec = null;
  toast('Uploaded. Now add your assessment.');
  S.history = []; go({name:'assess', id}, false);
}
let recTimer = null;
function startRecording(){
  S.rec.stage = 'recording'; render();
  const cv = $('vf'), t0 = performance.now(), fake = {sid:S.rec.sid, skill:S.rec.skill, rec:S.rec.date, q:.7, off:.4, restricted:false};
  const r = cv.getBoundingClientRect(); cv.width = r.width*2; cv.height = r.height*2;
  clearInterval(recTimer);
  recTimer = setInterval(() => { if (!cv.isConnected){ clearInterval(recTimer); return; }
    const t = (performance.now() - t0)/1000; drawClip(cv.getContext('2d'), cv.width, cv.height, fake, t % DUR, 1);
    const tt = $('recT'); if (tt) tt.textContent = '0:0' + Math.min(9, Math.floor(t)); }, 33);
}

/* --- compare --- */
function vCompare(){
  const sid = S.view.sid || (S.role==='parent' ? 'ava' : 'ava'), sk = S.view.skill || 'shooting';
  const cs = D.clips.filter(c => c.sid === sid && c.skill === sk && canSee(c)).sort((a,b) => a.rec.localeCompare(b.rec));
  const pickers = `<div class="cmp-pick">
    ${S.role==='coach' ? `<div class="field" style="margin:0"><label for="cmpStu">Pupil</label><select id="cmpStu" data-cmp="sid">${D.students.map(s => `<option value="${s.id}" ${s.id===sid?'selected':''}>${esc(s.name)}</option>`).join('')}</select></div>` : ''}
    <div class="field" style="margin:0"><label for="cmpSkill">Skill</label><select id="cmpSkill" data-cmp="skill">${SKILLS.map(s => `<option value="${s.id}" ${s.id===sk?'selected':''}>${s.name}</option>`).join('')}</select></div></div>`;
  if (cs.length < 2) return `<div class="wrap">${pickers}<div class="empty"><b>Two clips needed</b>${esc(stu(sid).name)} has ${cs.length} ${esc(skill(sk).name.toLowerCase())} clip${cs.length===1?'':'s'} so far. Record another to compare.</div></div>`;
  let a = clipById(S.view.a), b = clipById(S.view.b);
  if (!a || !cs.includes(a)) a = cs.length > 2 && cs[0].rubric !== cs[cs.length-1].rubric ? cs.find(c => c.rubric === cs[cs.length-1].rubric) : cs[0];
  if (!b || !cs.includes(b)) b = cs[cs.length-1];
  if (a === b) a = cs.find(c => c !== b);
  S.view.a = a.id; S.view.b = b.id;
  const sel = (key, cur) => `<select id="cmp${key}" data-cmp="${key}" aria-label="Clip ${key.toUpperCase()}">${cs.map(c => `<option value="${c.id}" ${c===cur?'selected':''}>${fmtDate(c.rec,true)}</option>`).join('')}</select>`;
  const col = (key, c) => { const R = RUBRICS[c.rubric];
    return `<div class="cmp-col"><div class="cmp-tag"><b><span class="badge">${key.toUpperCase()}</span>${fmtDate(c.rec,true)}</b><div class="field" style="margin:0;max-width:150px">${sel(key, c)}</div></div>
      ${playerHTML(c,'full')}
      <div class="alignrow"><button class="btn sec" data-action="setalign" data-key="${key}">${icon('align','s')} Set alignment point</button><span id="al-${key}">Not set</span></div>
      <div class="cmp-info">${levelChips(c)}${c.feedback ? `<p style="margin:4px 0"><b>Ms Hughes</b> ${esc(c.feedback)}</p>` : ''}<p class="meta">Rubric v${R.version}${c.drill ? ' · ' + esc(c.drill) : ''}</p></div></div>`; };
  let diff;
  if (a.rubric === b.rubric){
    const R = RUBRICS[a.rubric], [o, n] = a.rec <= b.rec ? [a, b] : [b, a];
    diff = `<div class="blk"><h3>What changed</h3><p class="meta">From ${fmtDate(o.rec)} to ${fmtDate(n.rec)}, same rubric (v${R.version}).</p>
      <table class="diff"><thead><tr><th>Area</th><th>${fmtDate(o.rec)}</th><th>${fmtDate(n.rec)}</th><th>Change</th></tr></thead><tbody>
      ${R.criteria.map(cr => { const x = o.scores[cr.key], y = n.scores[cr.key];
        if (!x || !y) return `<tr><td>${cr.name}</td><td>${x ? R.levels[x-1] : '–'}</td><td>${y ? R.levels[y-1] : '–'}</td><td class="meta">Not assessed</td></tr>`;
        const d = y - x, cls = d > 0 ? 'up' : d < 0 ? 'down' : 'same', ic = d > 0 ? 'up' : d < 0 ? 'down' : 'same';
        const txt = d > 0 ? `Up ${d} level${d>1?'s':''}` : d < 0 ? `Down ${-d}` : 'Same';
        return `<tr><td>${cr.name}</td><td>${R.levels[x-1]}</td><td>${R.levels[y-1]}</td><td><span class="chg ${cls}">${icon(ic,'s')}${txt}</span></td></tr>`; }).join('')}
      </tbody></table><p class="meta">Each area is shown on its own. We don't add them up into a single score.</p></div>`;
  } else {
    diff = `<div class="blk"><div class="callout">${icon('chart','s')}<span>These clips were assessed with different rubric versions (v${RUBRICS[a.rubric].version} and v${RUBRICS[b.rubric].version}), so their levels can't be compared directly. Watch the clips and read the feedback instead.</span></div></div>`;
  }
  return `<div class="wrap" style="max-width:none">${pickers}
    <div class="cmp-grid">${col('a', a)}${col('b', b)}</div>
    <div class="linkbar"><b>Play together</b><span id="linkHint">Scrub each clip to the same moment (for example, the ball leaving the hands) and tap “Set alignment point” on both. The clips don't start at the same point, so this lines them up.</span>
      <div class="row2"><button class="btn pri" data-action="linkplay" data-v="1" id="linkBtn" disabled>${icon('play','s')} Play both</button><button class="btn sec" data-action="linkplay" data-v="0.25" id="linkSlow" disabled>Play both at 0.25×</button></div></div>
    ${diff}
    <div class="blk" style="padding-top:0"><p class="meta">Tip: matching drills and camera angles make comparisons fairer.</p></div></div>`;
}

document.addEventListener('input', e => {
  const t = e.target;
  if (t.matches('input[type=range][data-pid]')){ const P = P_(t.dataset.pid); P.t = +t.value; P.playing = false; P.dirty = true; return; }
  if (t.dataset.bind){ const c = clipById(S.view.id); c[t.dataset.bind] = t.value; return; }
  if (t.id === 'groupName'){ S.gdraft.name = t.value; const er = $('groupErr'); if (er) er.textContent = ''; return; }
  if (t.id === 'pupilSearch'){ S.q = t.value; const pos = t.selectionStart; render(); const n = $('pupilSearch'); n.focus(); n.setSelectionRange(pos,pos); return; }
});
document.addEventListener('change', e => {
  const t = e.target;
  if (t.dataset.rec){ S.rec[t.dataset.rec] = t.value; return; }
  if (t.dataset.cmp){ const k = t.dataset.cmp; if (k === 'sid' || k === 'skill'){ S.view[k] = t.value; S.view.a = S.view.b = null; } else S.view[k] = t.value; render(); }
});
// keep the "Add at" label in sync with the assess player
setInterval(() => { const at = $('momentAt'); if (at){ const P = [...players.values()][0]; if (P) at.textContent = fmtT(P.t); } }, 120);
let rz, lastW = innerWidth; window.addEventListener("resize", () => { if (Math.abs(innerWidth - lastW) < 2) return; lastW = innerWidth; clearTimeout(rz); rz = setTimeout(render, 200); });
document.fonts && document.fonts.ready.then(() => players.forEach(p => p.dirty = true));
render();
</script>
